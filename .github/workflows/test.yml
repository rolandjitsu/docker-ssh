name: Test
on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize]

jobs:
  test-ssh-access:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup SSH agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Verify SSH connection to GitHub
        run: |
          ssh-add -l
          out=$(ssh -T -o StrictHostKeyChecking=no git@github.com 2>&1 || true)
          echo "$out"
          if ! echo "$out" | grep -q "successfully authenticated"; then
            echo "::error::SSH key is not recognized or authorized on GitHub. Verify that secrets.SSH_PRIVATE_KEY matches the deploy key on https://github.com/rolandjitsu/noop."
            exit 1
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Setup known_hosts
        run: ssh-keyscan -t ed25519,ecdsa,rsa github.com > ./known_hosts

      - name: Build and extract private repo contents
        env:
          BUILDX_BAKE_ENTITLEMENTS_FS: "0"
        run: docker buildx bake --allow=ssh

      - name: Check private repo contents
        run: cat ./priv-code/noop.txt
